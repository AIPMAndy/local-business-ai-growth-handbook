name: Real browser acceptance and PDF smoke checks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build.py'
      - 'assets/**'
      - 'data/**'
      - 'tests/browser_smoke.mjs'
      - '.github/workflows/browser-qa.yml'
  pull_request:
    paths:
      - 'scripts/build.py'
      - 'assets/**'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual public site and validate existing unit tests
        run: |
          python3 scripts/build.py
          python3 -m unittest discover -s tests -v
          node tests/test_calc.js
      - name: Install reproducible Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise navigation, calculator, progress, copy and PDF
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory _site >/tmp/local-business-qa.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          sleep 2
          SITE_URL=http://127.0.0.1:8766/ node tests/browser_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-business-browser-screenshots
          path: qa/browser/
          if-no-files-found: ignore
