name: Verify and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static site
        run: python3 scripts/build.py
      - name: Check HTML links, privacy, content, formulas
        run: |
          python3 -m unittest discover -s tests -v
          node --check assets/app.js
          node tests/test_calc.js
      - name: Validate PDF, contacts and render review previews
        run: |
          python3 -m pip install --disable-pip-version-check "pymupdf>=1.24,<2"
          python3 scripts/check_pdf_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: local-business-pdf-qa-previews
          path: pdf-qa/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Rebuild release and independently verify 13 public Pages assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 scripts/build.py
          python3 scripts/verify_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-business-live-verification
          path: qa/live-verification.json
          if-no-files-found: ignore
