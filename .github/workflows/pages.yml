name: Verify and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static site
        run: python3 scripts/build.py
      - name: Check HTML links, privacy, content, formulas
        run: |
          python3 -m unittest discover -s tests -v
          node --check assets/app.js
          node tests/test_calc.js
      - name: Validate PDF, contacts and render review previews
        run: |
          python3 -m pip install --disable-pip-version-check "pymupdf>=1.24,<2"
          python3 scripts/check_pdf_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: local-business-pdf-qa-previews
          path: pdf-qa/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify website and checksum-identical PDF online
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          meta=json.loads(Path("pdf/edition.json").read_text(encoding="utf-8"))
          url=os.environ["PAGES_URL"].rstrip("/")+"/"
          pdf=url+"downloads/local-business-ai-growth-handbook-guide.pdf"
          index=url+"index.html"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(pdf,timeout=25) as r: binary=r.read()
                  with urllib.request.urlopen(index,timeout=25) as r: homepage=r.read().decode("utf-8")
                  if hashlib.sha256(binary).hexdigest()!=meta["sha256"]:
                      raise ValueError("Online PDF differs from reviewed source")
                  if "downloads/local-business-ai-growth-handbook-guide.pdf" not in homepage:
                      raise ValueError("Online homepage not updated with the PDF download")
                  if "AIPMAndy" not in homepage or "a6no1.cn" not in homepage:
                      raise ValueError("Online business contacts are missing")
                  print("Verified downloadable",meta["pages"],"page PDF",pdf)
                  break
              except Exception as exc:
                  if attempt==11:
                      raise
                  print(f"CDN update pending (try {attempt+1}/12): {exc}")
                  time.sleep(5)
          PY
